# nginx-конфиг для дашборда thefootnotes.
# Кладётся в /etc/nginx/sites-available/thefootnotes и линкуется в sites-enabled.
# certbot --nginx потом сам допишет сюда блок listen 443 + сертификат и редирект с 80 на 443.

server {
    listen 80;
    server_name thefootnotes.app;

    # Фото и PDF-билеты приезжают с телефона через POST /api/v1/capture, а дефолт
    # nginx — всего 1 МБ. Держим чуть выше лимита приложения (20 МБ) — на накладные
    # расходы multipart.
    client_max_body_size 25m;

    location / {
        # Авторизация — на стороне приложения (вход по Telegram), basic-auth не нужен.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разбор билета через Claude (а тем более локальное распознавание голоса)
        # спокойно занимает больше дефолтных 60 секунд — иначе клиент получит 504,
        # хотя карточка на сервере создастся.
        proxy_read_timeout 300s;
    }
}
