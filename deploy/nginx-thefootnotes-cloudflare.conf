# nginx-конфиг для дашборда thefootnotes — вариант для Cloudflare с включённой проксёй
# (оранжевое облако). HTTPS для браузера обеспечивает edge Cloudflare; здесь мы
# терминируем HTTPS между Cloudflare и origin по Cloudflare Origin Certificate.
# Требует режим SSL/TLS = Full (strict) в панели Cloudflare. certbot тут НЕ нужен.
#
# Кладётся в /etc/nginx/sites-available/thefootnotes и линкуется в sites-enabled.
# Origin-сертификат и ключ — см. DEPLOY.md, приложение «Cloudflare».
#
# Порт 80 origin НЕ слушаем: сертификат — Cloudflare Origin (ACME на 80 не нужен), а
# редирект http->https делает сам Cloudflare (включи "Always Use HTTPS" в SSL/TLS ->
# Edge Certificates). Так порт 80 на хосте свободен для других сервисов (например docker).

server {
    listen 443 ssl;
    server_name thefootnotes.app;

    ssl_certificate     /etc/ssl/cloudflare/thefootnotes.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thefootnotes.key;

    # Фото и PDF-билеты приезжают с телефона через POST /api/v1/capture, а дефолт
    # nginx — всего 1 МБ. Держим чуть выше лимита приложения (20 МБ) — на накладные
    # расходы multipart. Выше 100 МБ смысла нет: столько же режет Cloudflare.
    client_max_body_size 25m;

    location / {
        # Авторизация — на стороне приложения (вход по Telegram), basic-auth не нужен.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разбор билета через Claude (а тем более локальное распознавание голоса)
        # спокойно занимает больше дефолтных 60 секунд — иначе клиент получит 504,
        # хотя карточка на сервере создастся.
        proxy_read_timeout 300s;
    }
}
