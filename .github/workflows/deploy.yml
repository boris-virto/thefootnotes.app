name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and startup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check dependencies and code
        run: |
          python -m pip check
          python -m compileall -q app deploy
          python -m pytest -q
      - name: Start real HTTP server without Telegram or paid APIs
        run: python -m deploy.smoke
      - name: Build production artifact from this exact commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p bundle/wheels
          python -m pip download --only-binary=:all: --require-hashes -r requirements.lock -d bundle/wheels
          cp -r app deploy bundle/
          find bundle -type d -name __pycache__ -prune -exec rm -rf {} +
          cp requirements.lock bundle/
          printf '%s\n' "$RELEASE_SHA" > bundle/RELEASE
          python -c 'import json,platform,sys; from pathlib import Path; Path("bundle/runtime.json").write_text(json.dumps({"python":list(sys.version_info[:2]),"machine":platform.machine()}))'
          python -m venv /tmp/footnotes-production
          /tmp/footnotes-production/bin/python -m pip install --no-index --find-links bundle/wheels --require-hashes -r requirements.lock
          /tmp/footnotes-production/bin/python -m pip check
          /tmp/footnotes-production/bin/python -m deploy.smoke
          tar -czf release.tar.gz -C bundle .
          sha256sum release.tar.gz > release.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}
          path: |
            release.tar.gz
            release.tar.gz.sha256
            deploy/release.py
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://thefootnotes.app
    concurrency:
      group: thefootnotes-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
      - name: Check artifact checksum
        run: sha256sum -c release.tar.gz.sha256
      - name: Configure SSH with a pinned host key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and activate checked release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          remote="$SSH_USER@$SSH_HOST"
          destination="/opt/thefootnotes/incoming/$RUN_NUMBER-$RUN_ATTEMPT"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "mkdir -p '$destination'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz release.tar.gz.sha256 deploy/release.py "$remote:$destination/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 "$remote" "cd '$destination' && sha256sum -c release.tar.gz.sha256 && python3 release.py release.tar.gz '$RELEASE_SHA' '$RUN_NUMBER'"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
